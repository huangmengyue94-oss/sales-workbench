services:
  - type: web
    name: sales-workbench
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/me
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
