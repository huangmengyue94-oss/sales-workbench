<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售商机管理工作台 | Sales Opportunity Workbench</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0f172a;--navy-2:#1e293b;--navy-3:#334155;
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;
  --text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-d:#1d4ed8;
  --green:#16a34a;--green-l:#f0fdf4;--amber:#d97706;--amber-l:#fffbeb;
  --red:#dc2626;--red-l:#fef2f2;--purple:#7c3aed;--purple-l:#f5f3ff;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* Layout */
#app{display:flex;height:100vh}
.sidebar{width:230px;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px}
.sidebar-brand p{font-size:11px;color:#64748b;margin-top:2px}
.nav-section{padding:10px 0}
.nav-section-label{font-size:10px;text-transform:uppercase;color:#475569;padding:8px 20px 4px;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:#94a3b8;font-size:13px;transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.nav-item.active{background:rgba(37,99,235,.15);color:#fff;border-left-color:var(--blue)}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.sidebar-footer{margin-top:auto;padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#475569}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.topbar h2{font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.topbar .tb-info{font-size:12px;color:var(--text-2)}
.topbar select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card);color:var(--text);cursor:pointer}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.card-pad{padding:18px}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-label{font-size:12px;color:var(--text-2);margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700;letter-spacing:-.5px}
.kpi-sub{font-size:11px;margin-top:4px}
.kpi-sub.up{color:var(--green)} .kpi-sub.down{color:var(--red)}
.kpi-icon{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.kpi-bar{height:4px;border-radius:2px;margin-top:10px;background:var(--border);overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width .6s}

/* Alerts */
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px;cursor:pointer;transition:.15s}
.alert-row:hover{filter:brightness(.97)}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-red{background:var(--red-l);color:var(--red)}.alert-red .alert-dot{background:var(--red)}
.alert-amber{background:var(--amber-l);color:var(--amber)}.alert-amber .alert-dot{background:var(--amber)}
.alert-green{background:var(--green-l);color:var(--green)}.alert-green .alert-dot{background:var(--green)}
.alert-blue{background:var(--blue-l);color:var(--blue)}.alert-blue .alert-dot{background:var(--blue)}
.alert-count{margin-left:auto;font-weight:700;font-size:16px}

/* Funnel */
.funnel-container{display:flex;flex-direction:column;gap:4px}
.funnel-stage{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;cursor:pointer;transition:.15s;position:relative}
.funnel-stage:hover{filter:brightness(.97)}
.funnel-bar{flex:1;height:42px;border-radius:8px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:600;font-size:13px;position:relative;overflow:hidden;transition:width .5s}
.funnel-stage-info{width:200px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.funnel-stage-name{font-weight:600;font-size:13px}
.funnel-stage-meta{font-size:11px;color:var(--text-2);text-align:right}
.funnel-rate{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;color:var(--text-3);font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:var(--blue-l)}
.tbl-row{cursor:pointer}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-blue{background:var(--blue-l);color:var(--blue-d)}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-amber{background:var(--amber-l);color:var(--amber)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-gray{background:#f1f5f9;color:var(--text-2)}
.badge-purple{background:var(--purple-l);color:var(--purple)}

/* Health Score */
.health{display:inline-flex;align-items:center;gap:6px}
.health-bar{width:36px;height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.health-fill{height:100%;border-radius:3px}
.health-val{font-size:12px;font-weight:700;min-width:24px}

/* Filters */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card)}
.filter-bar input{flex:1;min-width:180px}
.btn{padding:7px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-2)}.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid-1-2{display:grid;grid-template-columns:1fr 2fr;gap:16px}

/* Section title */
.sec-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title .count{font-size:12px;color:var(--text-3);font-weight:400}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border-radius:12px;max-width:800px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:sticky;top:0;background:var(--card);z-index:10}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-3);padding:0 4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:16px}
.tl-dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--blue)}
.tl-date{font-size:11px;color:var(--text-3);font-weight:600}
.tl-title{font-size:13px;font-weight:600;margin:2px 0}
.tl-desc{font-size:12px;color:var(--text-2)}

/* Progress */
.progress{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-1{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:600;color:var(--text-2)}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}

/* Task items */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:.15s}
.task-item:hover{border-color:var(--blue);background:var(--blue-l)}
.task-item.done{opacity:.5;text-decoration:line-through}
.task-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:1px;transition:.15s;display:flex;align-items:center;justify-content:center}
.task-check.done{background:var(--green);border-color:var(--green);color:#fff}
.task-time{font-size:11px;color:var(--text-3);font-weight:600;min-width:42px}
.task-title{font-size:13px;font-weight:500}
.task-meta{font-size:11px;color:var(--text-3);margin-top:2px}

/* Delivery stages */
.del-stages{display:flex;gap:0;align-items:center;flex-wrap:wrap}
.del-stage{flex:1;min-width:80px;text-align:center;padding:8px 4px;font-size:11px;font-weight:600;border-radius:0;position:relative}
.del-stage:first-child{border-radius:6px 0 0 6px}
.del-stage:last-child{border-radius:0 6px 6px 0}
.del-stage.done{color:#fff}
.del-stage.current{color:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.3)}
.del-stage.pending{background:var(--bg);color:var(--text-3)}
.del-arrow{color:var(--text-3);font-size:12px;padding:0 2px}

/* Chart container */
.chart-box{position:relative;height:260px}

/* AI Summary box */
.ai-box{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:10px;padding:14px}
.ai-box-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-box-content{font-size:13px;color:var(--text);line-height:1.6}
.ai-box-content strong{color:var(--navy)}

/* Misc */
.empty{text-align:center;padding:40px;color:var(--text-3);font-size:13px}
.mono{font-family:'SF Mono','Consolas',monospace}
.text-green{color:var(--green)}.text-red{color:var(--red)}.text-amber{color:var(--amber)}.text-blue{color:var(--blue)}.text-gray{color:var(--text-2)}
.fw700{font-weight:700}.fw600{font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap8{gap:8px}.gap12{gap:12px}
.flex-1{flex:1}
.w-full{width:100%}
.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-center{text-align:center}
.divider{height:1px;background:var(--border);margin:12px 0}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;background:var(--bg);color:var(--text-2);margin-right:4px}
.news-item{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;transition:.15s;cursor:pointer}
.news-item:hover{border-color:var(--blue);background:var(--blue-l)}
.news-cat{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-right:2px;background:var(--bg);color:var(--text-2)}
.news-impact{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;display:inline-block}
.news-impact.positive{background:var(--green-l);color:var(--green)}
.news-impact.neutral{background:#f1f5f9;color:var(--text-2)}
.news-impact.negative{background:var(--red-l);color:var(--red)}
.news-empty{text-align:center;padding:20px;color:var(--text-3);font-size:13px}
.news-badge{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600;background:var(--green-l);color:var(--green);margin-left:4px}

/* Login overlay */
#login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f172a,#1e293b);z-index:9999;display:flex;align-items:center;justify-content:center}
#login-overlay.hidden{display:none}
.login-box{background:#1e293b;padding:40px;border-radius:16px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-box h2{color:#fff;font-size:22px;margin-bottom:4px}
.login-box p{color:#94a3b8;font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;margin-bottom:12px;outline:none;transition:.15s}
.login-box input:focus{border-color:#3b82f6}
.login-box button{width:100%;padding:12px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.login-box button:hover{background:#2563eb}
.login-err{color:#ef4444;font-size:13px;margin-bottom:8px;display:none}
.login-hint{color:#64748b;font-size:12px;margin-top:16px;text-align:center}

/* User bar */
.user-bar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12px}
.user-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}

/* Sync indicator */
.sync-badge{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.sync-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.sync-badge.offline .dot{background:var(--red)}
.sync-badge.syncing .dot{background:var(--amber)}

@media print{
  .sidebar,.topbar,.nav-section{display:none!important}
  .main{margin:0!important}
  .content{padding:0!important}
  body{overflow:visible!important;background:#fff!important}
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>🐶 销售商机工作台</h1>
      <p>Sales Opportunity Workbench</p>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">核心模块</div>
      <div class="nav-item active" data-view="dashboard" onclick="nav('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        今日驾驶舱
      </div>
      <div class="nav-item" data-view="funnel" onclick="nav('funnel')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18l-7 9v6l-4 2v-8L3 4z"/></svg>
        销售漏斗
      </div>
      <div class="nav-item" data-view="opportunities" onclick="nav('opportunities')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        商机列表
      </div>
      <div class="nav-item" data-view="tasks" onclick="nav('tasks')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        任务中心
        <span class="nav-badge" id="nav-task-badge">0</span>
      </div>
      <div class="nav-item" data-view="contracts" onclick="nav('contracts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
        合同与报价
      </div>
      <div class="nav-item" data-view="delivery" onclick="nav('delivery')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18M12 8v12"/></svg>
        交付跟踪
      </div>
      <div class="nav-item" data-view="analytics" onclick="nav('analytics')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
        经营分析
      </div>
      <div class="nav-item" data-view="weekly" onclick="nav('weekly')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        周报回顾
      </div>
    </div>
    <div class="sidebar-footer">
      <div>Monica · 销售负责人</div>
      <div style="margin-top:2px">马来西亚 · 东南亚HR服务</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">今日驾驶舱</h2>
      <div class="spacer"></div>
      <div class="tb-info" id="today-date"></div>
      <div class="sync-badge" id="sync-badge"><span class="dot"></span><span id="sync-text">同步中...</span></div>
      <select id="owner-filter-top" onchange="applyOwnerFilter(this.value)">
        <option value="all">全部销售</option>
      </select>
      <button class="btn btn-sm" onclick="exportTemplate()" title="导出空白CSV模板" style="background:var(--bg);border:1px solid var(--border)">📋 模板</button>
      <button class="btn btn-sm" onclick="exportData()" title="导出全部数据" style="background:var(--bg);border:1px solid var(--border)">📤 导出</button>
      <button class="btn btn-sm" onclick="document.getElementById('import-file').click()" title="导入数据" style="background:var(--bg);border:1px solid var(--border)">📥 导入</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-sm" onclick="openTeamMgmt()" title="管理销售团队" style="background:var(--bg);border:1px solid var(--border)">⚙ 团队</button>
      <button class="btn btn-sm" onclick="openUserMgmt()" title="管理登录账户" id="user-mgmt-btn" style="background:var(--bg);border:1px solid var(--border);display:none">👤 账户</button>
      <button class="btn btn-sm" onclick="openSettings()" title="设置后端地址" style="background:var(--bg);border:1px solid var(--border)">⚙ 设置</button>
      <div class="user-bar"><span class="dot"></span><span id="current-user">—</span></div>
      <button class="btn btn-sm" onclick="logout()" style="background:var(--red-l);color:var(--red);border:1px solid var(--red-l)">退出</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const STAGES = ['Lead','Qualified','需求确认','方案报价','商务谈判','合同审批','合同签署','交付中','成功','失败'];
const STAGE_COLORS = ['#94a3b8','#64748b','#3b82f6','#2563eb','#7c3aed','#9333ea','#0891b2','#059669','#16a34a','#dc2626'];
const ACTIVE_STAGES = STAGES.slice(0,8);
const BIZ_TYPES = ['Recruitment','Payroll','EOR','Visa','Outsourcing','Training','Contractor','Executive Search','HR Consulting','PEO','Compliance','Immigration','HRIS'];
const COUNTRIES = ['Malaysia','Singapore','Thailand','Indonesia','Vietnam','Philippines'];
const INDUSTRIES = ['Data Center','Manufacturing','Semiconductor','Gaming','Retail','Logistics','IT','E-commerce','New Energy','建筑','其他'];
const SOURCES = ['Referral','人脉推荐','LinkedIn','Cold Call','Google','Partner','Event','公众号','Inbound'];
function getSalesTeam(){
  try{ const s=JSON.parse(localStorage.getItem('sales_team')); if(Array.isArray(s)&&s.length>0) return s; }catch(e){}
  return ['Monica'];
}
function saveSalesTeam(t){localStorage.setItem('sales_team',JSON.stringify(t))}
function refreshOwnerFilter(){
  const sel=document.getElementById('owner-filter-top');
  if(!sel)return;
  const cur=sel.value;
  sel.innerHTML='<option value="all">全部销售</option>'+getSalesTeam().map(s=>`<option value="${s}">${s}</option>`).join('');
  sel.value=cur;
}
const CONTACT_ROLES = ['HR','HRBP','HRD','业务负责人','采购','CEO','Finance','Legal'];

const DELIVERY_STAGES = {
  'Recruitment':['Offer','入职','试用期','付款'],
  'Payroll':['签约','员工信息收集','Payroll Setup','首月发薪','稳定运营'],
  'EOR':['合同','Visa','Onboarding','Payroll','Monthly Billing'],
  'Outsourcing':['签约','资源调配','驻场/远程','验收','月结'],
  'Visa':['签约','材料收集','递交','获批','登陆'],
  'Training':['签约','课程定制','交付','反馈','付款'],
  'Contractor':['签约','Onboarding','月度结算','续约']
};

// ==================== DATA ====================
const SAMPLE_OPPS = [];
const SAMPLE_TASKS = [];

const DATA_VERSION = 6;
const NEWS_CATEGORIES = {'expansion':'扩张','leadership':'人事变动','financial':'财务/融资','regulatory':'政策法规','industry':'行业动态','other':'其他'};

let state = {
  opps: [],
  tasks: [],
  view: 'dashboard',
  ownerFilter: 'all',
  sortKey: 'expClose',
  sortDir: 'asc',
  weekOffset: 0,
  online: false,
  user: null,
  sessionId: null
};

let charts = {};

// ==================== UTILITIES ====================
function fmtRM(n){
  if(n>=1000000) return 'RM '+(n/1000000).toFixed(2)+'M';
  if(n>=1000) return 'RM '+(n/1000).toFixed(0)+'K';
  return 'RM '+n.toLocaleString();
}
function fmtRMfull(n){return 'RM '+n.toLocaleString()}
function daysBetween(d1,d2){
  const one=24*60*60*1000;
  return Math.round(Math.abs(new Date(d2)-new Date(d1))/one);
}
function todayStr(){return new Date().toISOString().slice(0,10)}
function isOverdue(date){return new Date(date)<new Date(todayStr())}
function daysSince(date){return daysBetween(date,todayStr())}

function loadData(){
  const saved = localStorage.getItem('sales_workbench');
  if(saved){
    try{
      const d = JSON.parse(saved);
      if(d.version===DATA_VERSION){
        state.opps = d.opps||[];
        state.tasks = d.tasks||[];
        state.opps.forEach(o=>{if(!o.news)o.news=[]});
        return;
      }
    }catch(e){}
  }
  state.opps = [];
  state.tasks = [];
}
function saveData(){
  localStorage.setItem('sales_workbench',JSON.stringify({opps:state.opps,tasks:state.tasks,version:DATA_VERSION}));
}

function filteredOpps(){
  let r = state.opps;
  if(state.ownerFilter!=='all') r=r.filter(o=>o.owner===state.ownerFilter);
  return r;
}

function calcHealth(opp){
  if(opp.stage==='成功') return 100;
  if(opp.stage==='失败') return 0;
  let score=0;
  // Stage weight (0-40)
  const sw={'Lead':3,'Qualified':8,'需求确认':15,'方案报价':22,'商务谈判':30,'合同审批':35,'合同签署':38,'交付中':40};
  score += sw[opp.stage]||0;
  // Recency (0-20)
  const ds = daysSince(opp.lastContact);
  if(ds<=3) score+=20; else if(ds<=7) score+=15; else if(ds<=14) score+=8; else if(ds<=21) score+=4;
  // Budget (0-15)
  if(opp.hasBudget) score+=15;
  // Decision maker (0-15)
  if(opp.decisionMaker) score+=15;
  // Probability (0-10)
  score += Math.round(opp.prob/10);
  return Math.min(100,Math.max(0,score));
}

function healthColor(score){
  if(score>=85) return 'var(--green)';
  if(score>=60) return 'var(--amber)';
  return 'var(--red)';
}

function healthLabel(score){
  if(score>=85) return '高概率成交';
  if(score>=60) return '需持续推进';
  return '存在风险';
}

function getAlerts(){
  const opps = filteredOpps();
  const alerts = {red:[],amber:[],green:[],blue:[]};
  opps.forEach(o=>{
    if(o.stage==='成功'||o.stage==='失败') return;
    const ds = daysSince(o.lastContact);
    if(ds>7) alerts.red.push({type:'超7天未联系',opp:o,days:ds});
    const stageAge = opp.stageAge||0;
    const expOverdue = isOverdue(o.expClose);
    if(expOverdue) alerts.red.push({type:'预计签约日已过',opp:o});
    if(o.nextFollowup && isOverdue(o.nextFollowup)) alerts.amber.push({type:'跟进逾期',opp:o});
    if(o.stage==='合同审批'||o.stage==='合同签署') alerts.green.push({type:'即将签约',opp:o});
  });
  // Stage stagnation (mock)
  opps.forEach(o=>{
    if(o.stage==='方案报价'||o.stage==='需求确认'){
      const ds = daysSince(o.lastContact);
      if(ds>14) alerts.amber.push({type:'阶段停留过久',opp:o,days:ds});
    }
  });
  // This week closing
  opps.forEach(o=>{
    if(o.stage==='合同审批'||o.stage==='合同签署'||o.stage==='商务谈判'){
      if(o.prob>=60) alerts.green.push({type:'本周可能成交',opp:o});
    }
  });
  return alerts;
}

function getAISummary(opp){
  const concerns = [];
  if(opp.bizTypes.includes('EOR')) concerns.push('合规与税务');
  if(opp.bizTypes.includes('Payroll')) concerns.push('SLA与数据安全');
  if(opp.bizTypes.includes('Recruitment')) concerns.push('交付速度与人才质量');
  if(opp.bizTypes.includes('Outsourcing')) concerns.push('人员稳定性');
  const dm = opp.decisionMaker ? (opp.contacts[0]?.role||'决策人') : '尚未明确';
  const nextSteps = getNextSteps(opp.stage);
  return `<strong>海外布局：</strong>${opp.overseasLayout||'—'}<br>
    <strong>当前阶段：</strong>${opp.stage}（${opp.prob}%）<br>
    <strong>预算：</strong>${opp.hasBudget?'已确认 '+fmtRM(opp.amount):'未确认'}<br>
    <strong>决策人：</strong>${dm}<br>
    <strong>顾虑：</strong>${concerns.join('、')||'—'}`;
}

function getNextSteps(stage){
  const map = {
    'Lead':['预约首次会议，了解客户基本需求','确认是否有明确预算和时间表'],
    'Qualified':['深入了解业务痛点和采购流程','识别关键决策人'],
    '需求确认':['补充预算范围和项目时间节点','确认竞争对手和客户偏好'],
    '方案报价':['确认是否进入正式采购流程','了解报价反馈和调整空间'],
    '商务谈判':['锁定决策人与最终签约时间','确认合同核心条款（价格/SLA/付款）'],
    '合同审批':['跟踪内部审批进度','预沟通审批节点可能的问题'],
    '合同签署':['确认回签计划和生效日期','准备交付启动会'],
    '交付中':['确保首月交付顺利','建立客户反馈机制','关注续约机会'],
    '成功':['请求客户转介绍','总结案例用于营销'],
    '失败':['复盘失败原因','保持联系关注未来机会']
  };
  return map[stage]||['联系客户推进商机'];
}

function stageColor(stage){
  const i = STAGES.indexOf(stage);
  return i>=0 ? STAGE_COLORS[i] : '#94a3b8';
}

  const titles = {dashboard:'今日驾驶舱',funnel:'销售漏斗',opportunities:'商机列表',tasks:'任务中心',contracts:'合同与报价',delivery:'项目交付跟踪',analytics:'经营分析',weekly:'周报回顾'};

function render(){
  const c = document.getElementById('content');

// ==================== DASHBOARD ====================
function renderDashboard(){
  const opps = filteredOpps();
  const won = opps.filter(o=>o.stage==='成功');
  const wonAmount = won.reduce((s,o)=>s+o.amount,0);

    </div>
    <div class="kpi">
      <div class="kpi-icon" style="background:var(--green-l);color:var(--green)">💰</div>

    <div class="kpi">
      <div class="kpi-icon" style="background:var(--amber-l);color:var(--amber)">📈</div>

  const opps = filteredOpps().filter(o=>o.stage!=='成功'&&o.stage!=='失败');
  const stageData = ACTIVE_STAGES.map(s=>{
    const items = opps.filter(o=>o.stage===s);

  const maxAmount = Math.max(...stageData.map(d=>d.amount),1);
  
  // Conversion rates
  const leadCount = stageData[0].count;
  
  return `
  <div class="card card-pad mb16">
    <div class="sec-title">销售漏斗 <span class="count">Lead → 成功 全流程</span></div>
    <div class="funnel-container">
      ${stageData.map((d,i)=>{
        const convRate = leadCount>0 ? Math.round(d.count/leadCount*100) : 0;
        const stageConvRate = i>0 && stageData[i-1].count>0 ? Math.round(d.count/stageData[i-1].count*100) : 100;
        const widthPct = Math.max(20, d.count/maxCount*100);
        const avgDays = Math.round(15+i*3+Math.random()*5);
        return `<div class="funnel-stage" onclick="filterByStage('${d.stage}')">
          <div class="funnel-bar" style="width:${widthPct}%;background:${STAGE_COLORS[i]}">
            ${d.stage}
            <span style="margin-left:auto;font-weight:400;opacity:.9">${d.count} · ${fmtRM(d.amount)}</span>
          </div>
          <div class="funnel-stage-info">
            <div>
              <div class="funnel-stage-name">${d.stage}</div>
              <div class="funnel-stage-meta">${d.count} 个 · ${fmtRM(d.amount)}</div>
            </div>
            <div style="text-align:right">
              <span class="badge ${stageConvRate>=60?'badge-green':stageConvRate>=30?'badge-amber':'badge-red'}">${i===0?'—':'↓'+stageConvRate+'%'}</span>
              <div class="funnel-stage-meta" style="margin-top:2px">平均 ${avgDays}天</div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  
  <div class="grid-2">
    <div class="card card-pad">
      <div class="sec-title">阶段转化率 <span class="count">逐级递减</span></div>
      <div class="chart-box"><canvas id="funnel-conv"></canvas></div>
    </div>
    <div class="card card-pad">
      <div class="sec-title">阶段金额分布 <span class="count">RM</span></div>
      <div class="chart-box"><canvas id="funnel-amount"></canvas></div>
    </div>
  </div>

  <div class="card card-pad mt16">
    <div class="sec-title">瓶颈分析 <span class="count">哪里堵了</span></div>
    ${stageData.map((d,i)=>{
      if(i===0||d.count===0) return '';
      const prev = stageData[i-1];
      const dropRate = Math.round((1-d.count/prev.count)*100);
      if(dropRate>50) return `<div class="alert-row alert-red"><div class="alert-dot"></div><span><strong>${prev.stage} → ${d.stage}</strong>：流失率 ${dropRate}%，${prev.count-d.count} 个商机未推进</span></div>`;
      if(dropRate>30) return `<div class="alert-row alert-amber"><div class="alert-dot"></div><span><strong>${prev.stage} → ${d.stage}</strong>：流失率 ${dropRate}%，需关注推进</span></div>`;
      return '';
    }).join('') || '<div class="empty">暂无明显瓶颈</div>'}
  </div>
  `;
}

function initFunnelChart(){
  const opps = filteredOpps().filter(o=>o.stage!=='成功'&&o.stage!=='失败');
  const stageData = ACTIVE_STAGES.map(s=>{
    const items = opps.filter(o=>o.stage===s);
    return {stage:s,count:items.length,amount:items.reduce((sum,o)=>sum+o.amount,0)};
  });
  
  const cc = document.getElementById('funnel-conv');
  if(cc){
    const convRates = stageData.map((d,i)=>i===0?100:(stageData[i-1].count>0?Math.round(d.count/stageData[i-1].count*100):0));
    charts.funnelConv = new Chart(cc,{
      type:'line',
      data:{labels:stageData.map(d=>d.stage),datasets:[{label:'阶段转化率%',data:convRates,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.1)',fill:true,tension:.3,pointRadius:5,pointBackgroundColor:'#2563eb'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}
    });
  }
  const ac = document.getElementById('funnel-amount');
  if(ac){
    charts.funnelAmount = new Chart(ac,{
      type:'doughnut',
      data:{labels:stageData.map(d=>d.stage),datasets:[{data:stageData.map(d=>d.amount),backgroundColor:STAGE_COLORS.slice(0,8),borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:8}},tooltip:{callbacks:{label:(ctx)=>ctx.label+': '+fmtRM(ctx.raw)}}}}
    });
  }
}

function switchTab(e,tabId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  ['tab-contacts','tab-comms','tab-contracts','tab-delivery','tab-news','tab-tasks'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display = id===tabId?'block':'none';
  });
}

// ==================== TASK CENTER ====================
function renderTasks(){
  const today = todayStr();
  const allTasks = state.tasks;
  const todayTasks = allTasks.filter(t=>t.date===today && t.status==='pending').sort((a,b)=>a.time.localeCompare(b.time));
  const overdue = allTasks.filter(t=>t.status==='overdue').sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming = allTasks.filter(t=>t.date>today && t.status==='pending').sort((a,b)=>a.date.localeCompare(b.date));
  const done = allTasks.filter(t=>t.status==='done').sort((a,b)=>b.date.localeCompare(a.date));

  const taskList = (tasks,label,color)=>{
    if(tasks.length===0) return '';
    return `<div class="card card-pad mb16">
      <div class="sec-title" style="${color?'color:'+color:''}">${label} <span class="count">${tasks.length} 项</span></div>
      ${tasks.map(t=>{
        const opp = state.opps.find(o=>o.id===t.oppId);
        return `<div class="task-item ${t.status==='done'?'done':''}" onclick="${t.oppId?`openOppDetail(${t.oppId})`:''}">
          <div class="task-check ${t.status==='done'?'done':''}" onclick="event.stopPropagation();toggleTask(${t.id})">${t.status==='done'?'✓':''}</div>
          <div class="task-time">${t.time||t.date.slice(5)}</div>
          <div style="flex:1">
            <div class="task-title">${t.title}</div>
            <div class="task-meta">${opp?opp.customer+' · ':''}${t.priority==='high'?'<span class="text-red">高优</span>':t.priority==='medium'?'中优':'低优'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  };

  return `
  <div class="grid-2-1">
    <div>
      ${taskList(overdue,'逾期任务','var(--red)')}
      ${taskList(todayTasks,'今日待办','var(--blue)')}
      ${taskList(upcoming,'本周待办')}
    </div>
    <div>
      <div class="card card-pad mb16">
        <div class="sec-title">任务统计</div>
        <div class="grid-2">
          <div style="text-align:center;padding:10px">
            <div style="font-size:28px;font-weight:700;color:var(--red)">${overdue.length}</div>
            <div class="text-xs text-gray">逾期</div>
          </div>
          <div style="text-align:center;padding:10px">
            <div style="font-size:28px;font-weight:700;color:var(--blue)">${todayTasks.length}</div>
            <div class="text-xs text-gray">今日</div>
          </div>
          <div style="text-align:center;padding:10px">
            <div style="font-size:28px;font-weight:700;color:var(--amber)">${upcoming.length}</div>
            <div class="text-xs text-gray">待办</div>
          </div>
          <div style="text-align:center;padding:10px">
            <div style="font-size:28px;font-weight:700;color:var(--green)">${done.length}</div>
            <div class="text-xs text-gray">已完成</div>
          </div>
        </div>
        <button class="btn btn-primary btn-sm w-full mt12" onclick="addTaskForm()">+ 新增任务</button>
      </div>
      <div class="card card-pad">
        <div class="sec-title">AI 行动建议</div>
        <div class="text-sm text-gray" style="line-height:1.8">
          ${overdue.length>0?`🔴 <strong>${overdue.length}个逾期任务</strong>需立即处理，避免商机流失<br>`:''}
          ${todayTasks.filter(t=>t.priority==='high').length>0?`🔴 今日${todayTasks.filter(t=>t.priority==='high').length}个高优任务优先处理<br>`:''}
          ${upcoming.length>0?`📅 本周还有${upcoming.length}个待办，建议提前准备<br>`:''}
          ${done.length>0?`✅ 已完成${done.length}个任务，保持节奏<br>`:''}
          <br>
          <strong>建议：</strong>每天早上先处理逾期任务，再按优先级完成今日待办。每个商机至少保持7天内有一次联系记录。
        </div>
      </div>
    </div>
  </div>
  `;
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = t.status==='done'?(t.date<todayStr()?'overdue':'pending'):'done';
  saveData();
  if(state.view==='tasks') render();
  else updateNavBadges();
  // Refresh modal if open
  const modal = document.getElementById('modal-root');
  if(modal.innerHTML) {
    const oppId = t.oppId;
    if(oppId && document.getElementById('tab-tasks')){
      openOppDetail(oppId);
      setTimeout(()=>switchTab({target:document.querySelectorAll('.tab')[document.querySelectorAll('.tab').length-2]},'tab-tasks'),10);
    }
  }
}

// ==================== DELIVERY ====================
function renderDelivery(){
  const delivering = filteredOpps().filter(o=>o.delivery);
  return `
  <div class="card card-pad mb16">
    <div class="sec-title">交付中项目 <span class="count">${delivering.length} 个</span></div>
    <div class="text-sm text-gray mb12">签完合同不是终点 —— 跟踪交付进度、回款和续约</div>
  </div>
  ${delivering.map(o=>{
    const del = o.delivery;
    const pct = Math.round((del.current+1)/del.stages.length*100);
    const stages = del.stages;
    return `<div class="card card-pad mb12" style="cursor:pointer" onclick="openOppDetail(${o.id})">
      <div class="flex items-center justify-between mb12">
        <div>
          <span class="fw600" style="font-size:15px">${o.customer}</span>
          <span class="tag" style="margin-left:8px">${del.type}</span>
          <span class="tag">${o.country}</span>
        </div>
        <div style="text-align:right">
          <div class="fw700 text-blue" style="font-size:18px">${pct}%</div>
          <div class="text-xs text-gray">交付进度</div>
        </div>
      </div>
      <div class="del-stages">
        ${stages.map((s,i)=>{
          const bg = i<del.current?'var(--green)':i===del.current?'var(--blue)':'var(--bg)';
          const cls = i<del.current?'done':i===del.current?'current':'pending';
          return `<div class="del-stage ${cls}" style="background:${bg}">${s}</div>${i<stages.length-1?'<span class="del-arrow">→</span>':''}`;
        }).join('')}
      </div>
      <div class="progress mt12"><div class="progress-fill" style="width:${pct}%;background:var(--blue)"></div></div>
      <div class="flex justify-between mt8 text-xs text-gray">
        <span>合同金额：<strong class="text-blue">${fmtRM(o.amount)}</strong></span>
        <span>负责人：${o.owner}</span>
        <span>最后联系：${o.lastContact}</span>
      </div>
    </div>`;
  }).join('')}
  ${delivering.length===0?'<div class="empty">暂无交付中项目</div>':''}
  `;
}

function saveOpp(){
  const customer = document.getElementById('f-customer').value.trim();
  if(!customer){alert('请输入客户名称');return}
  const bizTypes = Array.from(document.querySelectorAll('.f-bizType:checked')).map(cb=>cb.value);
  const contactRoles = Array.from(document.querySelectorAll('.f-contactRole:checked')).map(cb=>cb.value);
  const data = {
    customer,
    country: document.getElementById('f-country').value,
    industry: document.getElementById('f-industry').value,
    owner: document.getElementById('f-owner').value,
    amount: parseInt(document.getElementById('f-amount').value)||0,
    margin: parseInt(document.getElementById('f-margin').value)||0,
    expClose: document.getElementById('f-expClose').value,
    stage: document.getElementById('f-stage').value,
    lastContact: document.getElementById('f-lastContact').value,
    nextFollowup: document.getElementById('f-nextFollowup').value||null,
    nextContactGoal: document.getElementById('f-nextContactGoal').value.trim(),
    prob: parseInt(document.getElementById('f-prob').value)||0,
    source: document.getElementById('f-source').value,
    hasBudget: document.getElementById('f-hasBudget').checked,
    decisionMaker: document.getElementById('f-decisionMaker').checked,
    bizTypes: bizTypes.length>0?bizTypes:['Recruitment'],
    contactRoles: contactRoles,
    reqSummary: document.getElementById('f-reqSummary').value.trim(),
    overseasLayout: document.getElementById('f-overseasLayout').value.trim(),
    followupStatus: document.getElementById('f-followupStatus').value.trim(),
    nextStrategy: document.getElementById('f-nextStrategy').value.trim()
  };
  if(editingOppId){
    const o = state.opps.find(x=>x.id===editingOppId);
    Object.assign(o,data);
  }else{
    data.id = Math.max(0,...state.opps.map(o=>o.id))+1;
    data.contacts = [];
    data.comms = [];
    data.contracts = [];
    data.delivery = null;
    state.opps.push(data);
  }
  saveData();
  closeModal();
  render();
}

  };

  saveData();
  alert('已同步到任务中心：'+task.title+' ('+task.date+')');

}

function getWeeklyNewsDigest(){
  const allNews=[];
  filteredOpps().forEach(o=>{
    (o.news||[]).forEach(n=>allNews.push({...n,oppId:o.id,customer:o.customer}));
  });
  const wa=new Date();wa.setDate(wa.getDate()-14);
  const waStr=wa.toISOString().slice(0,10);
  let recent=allNews.filter(n=>n.date>=waStr).sort((a,b)=>b.date.localeCompare(a.date));
  if(recent.length===0) recent=allNews.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  if(recent.length===0) return '<div class="empty">暂无客户新闻动态</div>';
  return recent.map(n=>{
    const ic=n.impact==='positive'?'positive':n.impact==='negative'?'negative':'neutral';
    const il=n.impact==='positive'?'利好':n.impact==='negative'?'利空':'中性';
    const cl=NEWS_CATEGORIES[n.category]||n.category;
    return `<div class="news-item" onclick="openOppDetail(${n.oppId})">
      <div class="flex items-center justify-between">
        <div><span class="fw600">${n.customer}</span><span class="news-cat" style="margin-left:4px">${cl}</span><span class="text-xs text-gray" style="margin-left:4px">${n.date}</span></div>
        <span class="news-impact ${ic}">${il}</span>
      </div>
      <div class="fw600 mt8" style="font-size:13px">${n.title}</div>
      ${n.impactNote?'<div class="text-sm mt8" style="padding:6px 10px;background:var(--blue-l);border-radius:6px;color:var(--blue-d)">📌 '+n.impactNote+'</div>':''}
    </div>`;
  }).join('');
}

function saveTeam(){
  const oldTeam = getSalesTeam();
  const inputs = document.querySelectorAll('.team-name-input');
  const newTeam = [];
  const renameMap = {};
  inputs.forEach(inp=>{
    const newName = inp.value.trim();
    if(!newName) return;
    newTeam.push(newName);
    const idx = inp.dataset.idx;
    if(idx !== undefined){
      const oldName = oldTeam[parseInt(idx)];
      if(oldName && oldName !== newName){
        renameMap[oldName] = newName;
      }
    }
  });
  const unique = [...new Set(newTeam)];
  if(unique.length < newTeam.length){ alert('存在重复名称，已自动去重'); }
  if(unique.length === 0){ alert('至少需要一名销售成员'); return; }
  // Apply renames to existing opps
  Object.entries(renameMap).forEach(([oldName,newName])=>{
    state.opps.forEach(o=>{ if(o.owner === oldName) o.owner = newName; });
  });
  // If ownerFilter is a renamed/deleted member, reset to all
  if(!unique.includes(state.ownerFilter)){ state.ownerFilter = 'all'; }
  saveSalesTeam(unique);
  saveData();
  closeModal();
  refreshOwnerFilter();
  render();
}

function getWeekStart(offset){
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  const monday = new Date(d.setDate(diff));
  monday.setDate(monday.getDate() + offset*7);
  return monday;
}
function fmtWeekDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getWeekLabel(offset){
  const start = getWeekStart(offset);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  const y = start.getFullYear();
  const firstJan = new Date(y,0,1);
  const weekNum = Math.ceil(((start - firstJan)/86400000 + firstJan.getDay()+1)/7);
  return `${y}-W${weekNum}（${fmtWeekDate(start)} ~ ${fmtWeekDate(end)}）`;
}
function getWeekOptions(){
  const opts = [];
  for(let i=-4;i<=2;i++){
    const label = getWeekLabel(i);
    const sel = i===state.weekOffset?'selected':'';
    const tag = i===0?'（本周）':i<0?'':'（下周）';
    opts.push(`<option value="${i}" ${sel}>${label}${tag}</option>`);
  }
  return opts.join('');
}
function changeWeeklyWeek(v){
  state.weekOffset = parseInt(v);
  render();
}
function getWeeklyOpps(){
  const start = getWeekStart(state.weekOffset);
  const end = new Date(start);
  end.setDate(end.getDate()+7);
  const startStr = fmtWeekDate(start);
  const endStr = fmtWeekDate(end);
  return state.opps.filter(o=>{
    const expClose = o.expClose||'';
    if(!expClose) return false;
    return expClose>=startStr && expClose<endStr;
  });
}

  teamStats.forEach(t=>{ csv += `${t.name},${t.active},${t.closing},${fmtRM(t.pipeline)},${fmtRM(t.won)}\n` });

  csv += `客户,国家,业务类型,金额,阶段,概率,负责人,下一步策略\n`;
  closingSoon.forEach(o=>{ csv += `${o.customer},${o.country},${(o.bizTypes||[]).join('/')},${o.amount},${o.stage},${o.prob}%,${o.owner},${(o.nextStrategy||'').replace(/,/g,'，')}\n` });
  csv += `\n风险商机清单\n`;
  csv += `客户,负责人,阶段,金额,最后联系,风险原因,跟进现状\n`;
  riskOpps.forEach(o=>{
    const reasons=[];
    if(daysSince(o.lastContact)>7) reasons.push(`超${daysSince(o.lastContact)}天未联系`);
    if(o.nextFollowup&&isOverdue(o.nextFollowup)) reasons.push('跟进逾期');
    if(isOverdue(o.expClose)) reasons.push('签约日已过');
    if(!o.hasBudget) reasons.push('预算未确认');

      }
    });
  });
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

function getApiBase(){
  return localStorage.getItem('api_base') || '';
}

async function api(method, path, body) {
  const base = getApiBase();
  const url = base + path;
  const opts = {method, headers:{'Content-Type':'application/json'}, credentials: base ? 'omit' : 'same-origin'};
  // For cross-origin: use header-based session
  if(base && state.sessionId){
    opts.headers['X-Session-Id'] = state.sessionId;
  }
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if(res.status===401){ showLogin(); throw new Error('not authed'); }
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'API error'); }
  const data = await res.json();
  // Capture session ID from login response
  if(path==='/api/login' && res.headers.get('X-Session-Id')){
    state.sessionId = res.headers.get('X-Session-Id');
  }
  return data;
}

function updateSyncBadge(status){
  const badge = document.getElementById('sync-badge');
  const text = document.getElementById('sync-text');
  if(!badge) return;
  badge.className = 'sync-badge ' + status;
  if(status==='online') text.textContent = '已同步';
  else if(status==='syncing') text.textContent = '同步中...';
  else if(status==='offline') text.textContent = '离线模式';
}

async function loadData(){
  updateSyncBadge('syncing');
  try{
    const d = await api('GET','/api/data');
    state.opps = d.opps||[];
    state.tasks = d.tasks||[];
    if(d.team && d.team.length>0) saveSalesTeam(d.team);
    state.opps.forEach(o=>{if(!o.news)o.news=[];if(!o.bizTypes)o.bizTypes=['Recruitment']});
    state.online = true;
    updateSyncBadge('online');
    return true;
  }catch(e){
    state.online = false;
    updateSyncBadge('offline');
    // Fallback to localStorage
    const saved = localStorage.getItem('sales_workbench');
    if(saved){
      try{
        const d = JSON.parse(saved);
        if(d.version===DATA_VERSION){
          state.opps = d.opps||[];
          state.tasks = d.tasks||[];
          state.opps.forEach(o=>{if(!o.news)o.news=[];if(!o.bizTypes)o.bizTypes=['Recruitment']});
        }
      }catch(err){}
    }
    return false;
  }
}

let _saveTimer = null;
function saveData(){
  // Always backup to localStorage
  localStorage.setItem('sales_workbench',JSON.stringify({opps:state.opps,tasks:state.tasks,version:DATA_VERSION}));
  // Debounce API calls (batch saves within 500ms)
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async()=>{
    if(!state.online) return;
    try{
      await api('POST','/api/data',{opps:state.opps,tasks:state.tasks,team:getSalesTeam(),version:DATA_VERSION});
      updateSyncBadge('online');
    }catch(e){
      updateSyncBadge('offline');
    }
  },500);
}

// Polling for real-time sync
let _pollTimer = null;
function startPolling(){
  if(_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async()=>{
    if(!state.online) return;
    try{
      const d = await api('GET','/api/data');
      // Check if data changed
      const newStr = JSON.stringify({opps:d.opps,tasks:d.tasks});
      const oldStr = JSON.stringify({opps:state.opps,tasks:state.tasks});
      if(newStr !== oldStr){
        state.opps = d.opps||[];
        state.tasks = d.tasks||[];
        if(d.team && d.team.length>0) saveSalesTeam(d.team);
        state.opps.forEach(o=>{if(!o.news)o.news=[];if(!o.bizTypes)o.bizTypes=['Recruitment']});
        render();
      }
      if(d.team && d.team.length>0 && JSON.stringify(d.team)!==JSON.stringify(getSalesTeam())){
        saveSalesTeam(d.team);
        render();
      }
      updateSyncBadge('online');
    }catch(e){
      state.online = false;
      updateSyncBadge('offline');
    }
  },8000); // 8 second polling
}

            <div class="form-group"><label>角色</label><select id="u-role"><option value="sales">销售</option><option value="admin">管理员</option></select></div>
          </div>
          <button class="btn btn-primary btn-sm mt12" onclick="addUser()">+ 新增账户</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

async function addUser(){
  const username = document.getElementById('u-username').value.trim();
  const name = document.getElementById('u-name').value.trim();
  const password = document.getElementById('u-password').value;
  const role = document.getElementById('u-role').value;
  if(!username||!password){ alert('用户名和密码不能为空'); return; }
  try{
    await api('POST','/api/users',{username,password,name,role});
    closeModal();
    openUserMgmt();
  }catch(e){
    alert(e.message);
  }
}

async function deleteUser(id){
  if(!confirm('确定删除该账户？')) return;
  try{
    await api('DELETE','/api/users/'+id);
    closeModal();
    openUserMgmt();
  }catch(e){ alert(e.message); }
}

async function resetUserPwd(id){
  const pwd = prompt('输入新密码：');
  if(!pwd) return;
  try{
    await api('POST','/api/users/'+id+'/reset-password',{password:pwd});
    alert('密码已重置');
  }catch(e){ alert(e.message); }
}

// ==================== INIT ====================
document.getElementById('today-date').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

// Boot: check auth, then load data and render
(async function(){
  const authed = await checkAuth();
  if(authed){
    await loadData();
    render();
    startPolling();
  }
})();
</script>
